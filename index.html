<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banknot Tarayıcı V3</title><style>
body{font-family:Arial;margin:0;background:#111;color:#fff}main{max-width:760px;margin:auto;padding:12px}.cam{position:relative;background:#000;aspect-ratio:4/3;border-radius:14px;overflow:hidden}video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:7%;right:7%;top:30%;bottom:30%;border:3px solid #ffd400;border-radius:10px;box-shadow:0 0 0 9999px #0005}.guide:after{content:"Seri numarasını bu alana getir";position:absolute;top:-27px;left:0;right:0;text-align:center;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{padding:12px;border:0;border-radius:10px;font-weight:bold}button:not(.x){background:#ffd400}.x{background:#39404c;color:white}.box{background:#1b2028;padding:12px;border-radius:12px;margin:10px 0}.big{font-size:26px;font-weight:bold}.small{font-size:12px;color:#adb5c2}table{width:100%;font-size:12px;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #39404c}canvas{display:none}</style></head>
<body><main><h2>🇹🇷 Banknot Seri No Tarayıcı V3</h2><div class="small">Kamera → OCR → 3 aşamalı doğrulama → kayıt → Excel/CSV</div>
<div class="cam"><video id="v" autoplay playsinline muted></video><div class="guide"></div></div>
<div class="row"><button id="open">📷 Kamerayı Aç</button><button id="scan" class="x" disabled>🔎 Seri No Oku</button><button id="close" class="x" disabled>⏹ Kapat</button></div>
<div id="st" class="box">Önce kamerayı açın.</div><div class="box"><div class="small">SONUÇ</div><div id="serial" class="big">—</div><div id="cf" class="small">Doğrulama: —</div><div class="row"><button id="save" disabled>➕ Kaydet</button></div></div>
<div class="box"><b>Kayıtlar</b><div id="cnt" class="small"></div><table><thead><tr><th>#</th><th>Seri No</th><th>Değer</th><th>Tarih/Saat</th></tr></thead><tbody id="list"></tbody></table><div class="row"><button id="csv" class="x">📥 Excel/CSV</button><button id="clear" class="x">🗑 Temizle</button></div></div><canvas id="c"></canvas></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d',{willReadFrequently:true});let stream=null,worker=null,last='',busy=false,rows=JSON.parse(localStorage.banknotV3||'[]');
const st=t=>document.getElementById('st').innerHTML=t;function render(){list.innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.s}</td><td>${r.val}</td><td>${r.d}</td></tr>`).join('');cnt.textContent=rows.length+' kayıt';localStorage.banknotV3=JSON.stringify(rows)}render();
open.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});v.srcObject=stream;open.disabled=1;scan.disabled=0;close.disabled=0;st('✅ Kamera açık. Seri numarasını sarı alana getirip <b>Seri No Oku</b> basın.')}catch(e){st('❌ Kamera açılamadı. Chrome kamera iznini kontrol edin. '+e.name)}};
close.onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;open.disabled=0;scan.disabled=1;close.disabled=1};
function norm(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'')}
function crop(mode){let W=v.videoWidth,H=v.videoHeight,X=W*.07,Y=H*.30,CW=W*.86,CH=H*.40;c.width=CW;c.height=CH;x.drawImage(v,X,Y,CW,CH,0,0,CW,CH);let im=x.getImageData(0,0,CW,CH),d=im.data;for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];if(mode==1)g=Math.max(0,Math.min(255,(g-125)*2+125));if(mode==2)g=g>145?255:0;d[i]=d[i+1]=d[i+2]=g}x.putImageData(im,0,0);return c}
function candidates(t){let s=norm(t),a=[],m;let r=/[A-Z]{1,3}[0-9]{6,8}/g;while(m=r.exec(s))a.push(m[0]);return a}
async function getW(){if(worker)return worker;st('⏳ OCR motoru hazırlanıyor…');worker=await Tesseract.createWorker('eng',1);await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',tessedit_pageseg_mode:'7',user_defined_dpi:'300'});return worker}
scan.onclick=async()=>{if(busy)return;busy=1;scan.disabled=1;save.disabled=1;serial.textContent='Okunuyor…';try{let w=await getW(),hits={};for(let m=0;m<3;m++){st('🔎 Görüntü '+(m+1)+'/3 analiz ediliyor…');let r=await w.recognize(crop(m));for(let q of candidates(r.data.text)){hits[q]??={n:0,cf:0};hits[q].n++;hits[q].cf=Math.max(hits[q].cf,r.data.confidence||0)}}let a=Object.entries(hits).map(([s,z])=>({s,...z,score:z.n*100+z.cf})).sort((a,b)=>b.score-a.score);if(!a.length){serial.textContent='Bulunamadı';cf.textContent='⚠️ Geçerli seri numarası bulunamadı.';st('❌ Banknotu düz tutup tekrar deneyin.');return}let b=a[0];last=b.s;serial.textContent=last;cf.textContent=`Doğrulama: ${b.n}/3 işlemde bulundu • OCR ${Math.round(b.cf)}%`;save.disabled=0;st('✅ Aday bulundu. Kaydetmeden önce numarayı banknotla karşılaştırın.')}catch(e){st('❌ OCR hatası: '+e.message);serial.textContent='Hata'}finally{busy=0;scan.disabled=0}};
save.onclick=()=>{let val=prompt('Banknot değeri kaç TL?','100');if(!val)return;val=val.replace(/[^0-9]/g,'');if(!val)return;if(rows.some(r=>r.s==last)&&!confirm('⚠️ Bu seri numarası daha önce kayıtlı. Yine de kaydedilsin mi?'))return;rows.push({s:last,val:val+' TL',d:new Date().toLocaleString('tr-TR')});render();save.disabled=1;st('✅ Kayıt yapıldı.')};
csv.onclick=()=>{let a=[['Sıra No','Seri No','Değer','Tarama Tarih_Saat'],...rows.map((r,i)=>[i+1,r.s,r.val,r.d])];let b=new Blob(['\ufeff'+a.map(r=>r.map(q=>`"${String(q).replaceAll('"','""')}"`).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),z=document.createElement('a');z.href=URL.createObjectURL(b);z.download='banknot_seri_kayitlari_V3.csv';z.click()};
clear.onclick=()=>{if(confirm('Tüm kayıtlar silinsin mi?')){rows=[];render()}}
</script></body></html>
