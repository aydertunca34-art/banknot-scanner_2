<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banknot Seri No V2</title>
<style>body{font-family:Arial;margin:0;background:#eee}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh;padding:14px}video{width:100%;background:#111;border-radius:12px}.preview{position:relative}.guide{position:absolute;left:8%;right:8%;top:34%;height:32%;border:3px solid #0c6;border-radius:8px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button{padding:12px;border:0;border-radius:8px;background:#1565c0;color:#fff;font-size:16px}.stop{background:#c62828}.status{padding:10px;background:#eee;border-radius:8px;font-weight:bold}.bad{background:#ffebee;color:#b00020}.good{background:#e8f5e9;color:#176b2c}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #ccc;padding:7px}</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></head><body><div class="app"><h2>Banknot Seri Numarası Tarayıcı</h2>
<p>Kamerayı açın ve <b>Otomatik Okumayı Başlat</b>'a bir kez basın. Yeşil alan seri numarasının bulunduğu bölge için kullanılır. Yeni banknot geldiğinde otomatik okunur.</p>
<div class="preview"><video id="v" autoplay playsinline muted></video><div class="guide"></div></div>
<div class="controls"><button id="open">Kamerayı Aç</button><button id="start">Otomatik Okumayı Başlat</button><button id="save" class="stop">Kaydet ve Bitir</button></div>
<div id="s" class="status">Kamera kapalı.</div><table><thead><tr><th>#</th><th>Seri No</th><th>Durum</th><th>Tarih/Saat</th></tr></thead><tbody id="r"></tbody></table></div>
<script>
const v=document.getElementById('v'),s=document.getElementById('s'),r=document.getElementById('r'),c=document.createElement('canvas');let stream,running=false,busy=false,records=[],candidate="",stable=0,last="",lastTime=0;
function st(x,cl=''){s.textContent=x;s.className='status '+cl}
open.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;st('Kamera açık. Otomatik okumayı başlatın.','good')}catch(e){st('Kamera açılamadı: '+e.message,'bad')}};
start.onclick=()=>{if(!v.srcObject)return st('Önce Kamerayı Aç’a basın.','bad');if(!running){running=true;st('Otomatik okuma aktif...','good');loop()}};
function candidates(t){t=t.toUpperCase().replace(/[^A-Z0-9\s]/g,' ').replace(/\s+/g,' ').trim();let a=t.match(/[A-Z]{1,3}\s*[0-9]{6,10}/g)||[];return [...new Set(a.map(x=>x.replace(/\s/g,'')))].filter(x=>/^[A-Z]{1,3}[0-9]{6,10}$/.test(x))}
async function read(){if(busy||!running)return;busy=true;let w=v.videoWidth,h=v.videoHeight;c.width=Math.floor(w*.84);c.height=Math.floor(h*.32);c.getContext('2d').drawImage(v,Math.floor(w*.08),Math.floor(h*.34),Math.floor(w*.84),Math.floor(h*.32),0,0,c.width,c.height);
try{let q=await Tesseract.recognize(c,'eng',{tessedit_pageseg_mode:7});let a=candidates(q.data.text);if(a.length){let x=a[0];if(x==candidate)stable++;else{candidate=x;stable=1}if(stable>=2){if(records.some(z=>z.serial==x))st('⚠️ TEKRAR: '+x+' daha önce kaydedildi.','bad');else{records.push({serial:x,time:new Date().toLocaleString('tr-TR')});render();st('✓ Kaydedildi: '+x,'good')}last=x;lastTime=Date.now();stable=0}}else{stable=0;st('Seri numarası aranıyor...')}}catch(e){st('OCR hatası: '+e.message,'bad')}busy=false}
async function loop(){if(!running)return;await read();setTimeout(loop,700)}
function render(){r.innerHTML=records.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.serial}</b></td><td>Kaydedildi</td><td>${x.time}</td></tr>`).join('')}
save.onclick=()=>{running=false;if(stream)stream.getTracks().forEach(x=>x.stop());if(!records.length)return st('Kayıt yok.','bad');let csv='\uFEFFSıra;Seri Numarası;Durum;Tarih/Saat\n';records.forEach((x,i)=>csv+=`${i+1};${x.serial};Kaydedildi;${x.time}\n`);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Banknot_Seri_Numaralari.csv';a.click();st(records.length+' kayıt kaydedildi. Okuma sonlandı.','good')}
</script></body></html>
