<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banknot Tarayıcı V4</title><style>body{font-family:Arial;background:#101318;color:white;margin:0}header,main{padding:14px;max-width:760px;margin:auto}.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:5%;right:5%;top:28%;bottom:28%;border:3px solid #ffd400;border-radius:10px;box-shadow:0 0 0 9999px #0005}.guide:after{content:"SERİ NUMARASINI BU ALANA GETİR";position:absolute;top:-25px;left:0;right:0;text-align:center;font-size:12px;color:#ffd400}button,select{padding:12px;margin:5px;border:0;border-radius:9px;font-weight:bold}button{background:#ffd400}button:disabled{opacity:.4}.panel{background:#171c23;padding:12px;border-radius:12px;margin-top:10px}.big{font-size:26px;font-weight:bold}.bad{color:#ff8888}.ok{color:#7ee787}table{width:100%;font-size:12px;margin-top:10px}td,th{padding:7px;border-bottom:1px solid #333}canvas{display:none}</style></head><body><header><h2>🇹🇷 Banknot Seri No Tarayıcı V4</h2><small>Önce kamera açılır, sonra OCR aktif olur.</small></header><main><div class="cam"><video id="video" autoplay muted playsinline></video><div class="guide"></div></div><button id="open">📷 Kamerayı Aç</button><button id="scan" disabled>🔎 Seri No Oku</button><button id="close" disabled>⏹ Kapat</button><div id="status" class="panel">Kamera kapalı.</div><div class="panel"><small>OCR SONUCU</small><div id="serial" class="big">—</div><div id="conf">Doğrulama: —</div><select id="value"><option value="">Banknot değeri</option><option>5 TL</option><option>10 TL</option><option>20 TL</option><option>50 TL</option><option>100 TL</option><option>200 TL</option></select><button id="save" disabled>➕ Kaydet</button></div><div class="panel"><b>Kayıtlar</b><div id="count"></div><table><thead><tr><th>#</th><th>Seri</th><th>Değer</th><th>Tarih</th></tr></thead><tbody id="rows"></tbody></table><button id="csv">📥 Excel/CSV</button><button id="clear">🗑 Temizle</button></div><canvas id="canvas"></canvas></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const v=document.getElementById('video'),c=document.getElementById('canvas'),x=c.getContext('2d',{willReadFrequently:true});let stream=null,worker=null,last='',busy=false,rows=JSON.parse(localStorage.banknotV4||'[]');
const st=t=>document.getElementById('status').innerHTML=t;function render(){document.getElementById('rows').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.s}</td><td>${r.v}</td><td>${r.d}</td></tr>`).join('');document.getElementById('count').textContent=rows.length+' kayıt';localStorage.banknotV4=JSON.stringify(rows)}render();
async function openCam(){if(!isSecureContext){st('❌ Kamera için HTTPS gerekir. GitHub Pages adresini Chrome ile açın.');return}if(!navigator.mediaDevices?.getUserMedia){st('❌ Tarayıcı kamera erişimini desteklemiyor.');return}try{st('⏳ Kamera açılıyor…');try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'environment'},width:{ideal:1920},height:{ideal:1080}}})}catch(e){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'environment'}})}v.srcObject=stream;await v.play();await new Promise((res,rej)=>{let t=Date.now();(function q(){if(v.videoWidth){res()}else if(Date.now()-t>5000)rej(Error('Görüntü alınamadı.'));else requestAnimationFrame(q)})()});document.getElementById('open').disabled=true;document.getElementById('close').disabled=false;document.getElementById('scan').disabled=false;st('✅ <b>Kamera açıldı.</b> Seri numarasını sarı çerçeveye getirip <b>Seri No Oku</b> düğmesine basın.')}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;st('❌ Kamera açılamadı: '+(e.name==='NotAllowedError'?'Kamera izni verilmedi. Chrome site ayarlarından Kamera → İzin ver seçin.':e.message))}}
function closeCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;document.getElementById('open').disabled=false;document.getElementById('close').disabled=true;document.getElementById('scan').disabled=true;st('Kamera kapatıldı.')}
function norm(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'')}
function crop(mode){let W=v.videoWidth,H=v.videoHeight,X=W*.05,Y=H*.28,w=W*.9,h=H*.44;c.width=w;c.height=h;x.drawImage(v,X,Y,w,h,0,0,w,h);let im=x.getImageData(0,0,w,h),d=im.data;for(let i=0;i<d.length;i+=4){let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];let z=mode===0?g:mode===1?Math.max(0,Math.min(255,(g-125)*2.2+128)):g>145?255:0;d[i]=d[i+1]=d[i+2]=z}x.putImageData(im,0,0);return c}
function cand(t){let a=[],r=/[A-Z]{1,3}[0-9]{6,8}/g,m,s=norm(t);while(m=r.exec(s))a.push(m[0]);return a}
async function getW(){if(worker)return worker;worker=await Tesseract.createWorker('eng',1);await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',tessedit_pageseg_mode:'7',user_defined_dpi:'300'});return worker}
async function scan(){if(!stream||!v.videoWidth){st('❌ Kamera hazır değil.');return}if(busy)return;busy=true;document.getElementById('scan').disabled=true;document.getElementById('save').disabled=true;st('⏳ OCR çalışıyor…');try{let w=await getW(),h={};for(let m=0;m<3;m++){let r=await w.recognize(crop(m)),a=cand(r.data.text);a.forEach(s=>{if(!h[s])h[s]={n:0,c:0};h[s].n++;h[s].c=Math.max(h[s].c,r.data.confidence||0)})}let q=Object.entries(h).sort((a,b)=>(b[1].n*100+b[1].c)-(a[1].n*100+a[1].c));if(!q.length){document.getElementById('serial').textContent='Bulunamadı';st('❌ Seri numarası bulunamadı. Banknotu yaklaştırıp tekrar deneyin.');return}last=q[0][0];document.getElementById('serial').textContent=last;document.getElementById('conf').textContent=`Doğrulama: ${q[0][1].n}/3 görüntüde bulundu • OCR ${Math.round(q[0][1].c)}%`;document.getElementById('save').disabled=false;st('✅ Seri numarası bulundu. Kaydetmeden önce banknot üzerindeki numarayla karşılaştırın.')}catch(e){st('❌ OCR hatası: '+e.message)}finally{busy=false;document.getElementById('scan').disabled=false}}
document.getElementById('save').onclick=()=>{let val=document.getElementById('value').value;if(!last||!val){alert('Seri numarası ve banknot değeri seçilmelidir.');return}if(rows.some(r=>r.s===last)&&!confirm('⚠️ Bu seri numarası daha önce kayıtlı. Yine de kaydedilsin mi?'))return;rows.push({s:last,v:val,d:new Date().toLocaleString('tr-TR')});render();document.getElementById('save').disabled=true;st('✅ Kayıt tamamlandı.')};
document.getElementById('open').onclick=openCam;document.getElementById('close').onclick=closeCam;document.getElementById('scan').onclick=scan;
document.getElementById('clear').onclick=()=>{if(confirm('Tüm kayıtlar silinsin mi?')){rows=[];render()}};
document.getElementById('csv').onclick=()=>{let a=[['Sıra No','Seri No','Değer','Tarama Tarih_Saat'],...rows.map((r,i)=>[i+1,r.s,r.v,r.d])];let b=new Blob(['\ufeff'+a.map(q=>q.map(z=>`"${String(z).replace(/"/g,'""')}"`).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a1=document.createElement('a');a1.href=u;a1.download='banknot_V4.csv';a1.click();URL.revokeObjectURL(u)};
</script></body></html>
