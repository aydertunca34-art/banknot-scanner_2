<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banknot Seri Numarası Tarayıcı V3</title>
    <!-- Tesseract.js kütüphanesini CDN üzerinden dahil ediyoruz -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1e293b;
            --light: #f8fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: var(--light);
            color: var(--dark);
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }
        .info-box {
            background-color: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            border-radius: 0 8px 8px 0;
        }
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Seri numarası hedef bölgesi (Yeşil alan) */
        .overlay-box {
            position: absolute;
            top: 60%; /* Banknot alt/orta kısmındaki seri nosu varsayımı */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 45px;
            border: 3px solid #22c55e;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            pointer-events: none;
            z-index: 10;
        }
        .overlay-label {
            position: absolute;
            top: -22px;
            left: 0;
            background: #22c55e;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px 3px 0 0;
            font-weight: bold;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        button {
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }
        #btnCamera { background-color: var(--dark); }
        #btnScan { background-color: var(--primary); }
        #btnFinish { grid-column: span 2; background-color: var(--success); }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-panel {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .status-row:last-child { margin-bottom: 0; }
        .label { font-weight: 600; color: #64748b; }
        .value { font-weight: bold; }
        .warning { color: var(--danger); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        /* Gizli canvas (Görüntü işleme ve kırpma için) */
        canvas { display: none; }
        
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        .results-table th, .results-table td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
        }
        .results-table th { background-color: #f8fafc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Banknot Seri No Tarayıcı V3</h2>
    
    <div class="info-box">
        <strong>Önemli Protokol:</strong> Bu uygulamanın çalışabilmesi için cihazınızda <code>https://</code> üzerinden yayınlanması gerekmektedir. Yerel <code>file://</code> açılışlarında tarayıcı güvenlik mimarisi kamerayı engeller.
    </div>

    <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div class="overlay-box">
            <div class="overlay-label">SERİ NUMARASI BÖLGESİ</div>
        </div>
    </div>

    <div class="btn-group">
        <button id="btnCamera" onclick="initCamera()">Kamerayı Aç</button>
        <button id="btnScan" onclick="startContinuousScan()" disabled>Otomatik Okumayı Başlat</button>
        <button id="btnFinish" onclick="saveAndFinish()" disabled>Kaydet ve Bitir</button>
    </div>

    <div class="status-panel">
        <div class="status-row">
            <span class="label">Durum:</span>
            <span id="txtStatus" class="value" style="color: var(--danger);">Kamera kapalı.</span>
        </div>
        <div class="status-row">
            <span class="label">Son Okunan:</span>
            <span id="txtLastRead" class="value">-</span>
        </div>
        <div id="txtAlert" class="value warning" style="display: none; text-align: center; margin-top: 8px;"></div>
    </div>

    <table class="results-table">
        <thead>
            <tr>
                <th>Seri No</th>
                <th>Durum</th>
                <th>Tarih/Saat</th>
            </tr>
        </thead>
        <tbody id="logTableBody">
            <!-- Kayıtlar buraya eklenecek -->
        </tbody>
    </table>
</div>

<canvas id="cropCanvas"></canvas>

<script>
    let stream = null;
    let isScanning = false;
    let scanInterval = null;
    let tesseractWorker = null;
    
    // Hafıza ve doğrulama mekanizmaları
    const savedSerialNumbers = new Set();
    let lastRawRead = ""; 
    
    const video = document.getElementById('video');
    const cropCanvas = document.getElementById('cropCanvas');
    const ctx = cropCanvas.getContext('2d');
    
    const btnCamera = document.getElementById('btnCamera');
    const btnScan = document.getElementById('btnScan');
    const btnFinish = document.getElementById('btnFinish');
    const txtStatus = document.getElementById('txtStatus');
    const txtLastRead = document.getElementById('txtLastRead');
    const txtAlert = document.getElementById('txtAlert');
    const logTableBody = document.getElementById('logTableBody');

    // Tesseract.js Worker Başlatma
    async function initOCR() {
        txtStatus.innerText = "OCR Modülü yükleniyor...";
        tesseractWorker = await Tesseract.createWorker('eng'); // Banknot seri noları genellikle Latin alfabesidir
        // Yalnızca büyük harf ve rakamları araması için kısıtlıyoruz (Performans ve doğruluk için)
        await tesseractWorker.setParameters({
            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
        });
        txtStatus.innerText = "Kamera açılmaya hazır.";
    }
    initOCR();

    // 1. AŞAMA: HTTPS ve Kamera Açılması
    async function initCamera() {
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            alert("Kritik Hata: Tarayıcı güvenlik protokolleri gereği kamera erişimi yalnızca HTTPS bağlantılarında çalışır! Lütfen sayfayı güvenli bir sunucuya yükleyin.");
            txtStatus.innerText = "Hata: HTTPS Gerekli.";
            return;
        }

        try {
            txtStatus.innerText = "Kamera aranıyor...";
            const constraints = {
                video: {
                    facingMode: "environment", // Arka kamerayı zorunlu kıl
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };
            
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            txtStatus.innerText = "Kamera aktif. Taramaya hazır.";
            txtStatus.style.color = "var(--success)";
            btnCamera.disabled = true;
            btnScan.disabled = false;
            btnFinish.disabled = false;
        } catch (err) {
            console.error("Kamera açma hatası: ", err);
            txtStatus.innerText = "Kamera açma başarısız: " + err.message;
            txtStatus.style.color = "var(--danger)";
        }
    }

    // 2. AŞAMA: Kesintisiz / Butonsuz Sürekli Tarama Döngüsü
    function startContinuousScan() {
        if (!stream) return;
        isScanning = true;
        btnScan.disabled = true;
        txtStatus.innerText = "Otomatik sürekli tarama devrede...";
        txtStatus.style.color = "var(--primary)";
        
        // Saniyede 2 kez (500ms) görüntü işleme ve kırpma tetiklenir
        scanInterval = setInterval(processFrame, 500);
    }

    // GÖRÜNTÜ İŞLEME VE OCR AKIŞI
    async function processFrame() {
        if (!isScanning) return;
        
        // Video boyutlarını al
        const videoWidth = video.videoWidth;
        const videoHeight = video.videoHeight;
        if (videoWidth === 0 || videoHeight === 0) return;

        // Canvas boyutlarını video ile eşitle
        cropCanvas.width = videoWidth;
        cropCanvas.height = videoHeight;
        
        // Mevcut kareyi canvas'a çiz
        ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
        
        // HEDEF BÖLGE (KIRPMA MİMARİSİ)
        // Arayüzdeki yeşil kutunun koordinatlarına denk gelen alanı pikselsel hesapla
        // Arayüzde: top: 60%, height: 45px, left: 50%, width: 70%
        const cropWidth = videoWidth * 0.70;
        const cropHeight = videoHeight * 0.15; // Perspektif ve kaymaları tolere etmek için dikey alan esnetildi
        const cropX = (videoWidth - cropWidth) / 2;
        const cropY = videoHeight * 0.55; 

        // Görüntü İşleme: Perspektif/Kupür tespiti simülasyonu ve Bölgesel İzolasyon
        const imageData = ctx.getImageData(cropX, cropY, cropWidth, cropHeight);
        
        // Ön İşleme (Binarization / Eşikleme): Gri tonlama ve yüksek kontrast
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            let brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
            // Eşik değeri (128) üzerini beyaz, altını siyah yaparak harfleri keskinleştirme
            let binary = brightness > 128 ? 255 : 0;
            data[i] = binary;     // R
            data[i + 1] = binary; // G
            data[i + 2] = binary; // B
        }
        
        // Kırpılmış ve optimize edilmiş görseli ara işleme canvas'ına yaz
        cropCanvas.width = cropWidth;
        cropCanvas.height = cropHeight;
        ctx.putImageData(imageData, 0, 0);
        
        // OCR Aşaması
        try {
            const result = await tesseractWorker.recognize(cropCanvas);
            // Metni temizle (Boşlukları sil, sadece Alfanumerik tut)
            let cleanedText = result.data.text.replace(/[^A-Z0-9]/g, "").trim();
            
            // Banknot seri no formatı kontrolü (Örn: 9-12 karakter uzunluğu standartları için)
            if (cleanedText.length >= 8 && cleanedText.length <= 14) {
                handleOcrResult(cleanedText);
            }
        } catch (ocrErr) {
            console.error("OCR Hatası:", ocrErr);
        }
    }

    // İKİ ARDIŞIK OKUMAYLA DOĞRULAMA VE BELLEK KONTROLÜ
    function handleOcrResult(currentRead) {
        txtAlert.style.display = "none";
        
        // 1. Kriter: İki ardışık okuma eşleşmeli (Ardışık Doğrulama)
        if (currentRead !== lastRawRead) {
            lastRawRead = currentRead; // İlk okuma olarak hafızaya al, bir sonraki döngüde doğrulanacak
            return;
        }
        
        // İki kere üst üste aynı okunduysa doğrulama tamamlanır
        txtLastRead.innerText = currentRead;
        
        // 2. Kriter: Aynı Seri Numarası Tekrar Görülürse TEKRAR Uyarısı
        if (savedSerialNumbers.has(currentRead)) {
            txtAlert.innerText = `⚠️ TEKRAR UYARISI: ${currentRead} numaralı banknot daha önce tarandı!`;
            txtAlert.style.display = "block";
            return;
        }
        
        // 3. Kriter: Yeni ise Kayıt Altına Alma
        savedSerialNumbers.add(currentRead);
        addLogToTable(currentRead, "Başarılı");
    }

    function addLogToTable(serial, status) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString() + " " + now.toLocaleDateString();
        
        const row = document.createElement('tr');
        row.innerHTML = `
            <td style="font-family: monospace; font-weight: bold;">${serial}</td>
            <td style="color: var(--success); font-weight: bold;">${status}</td>
            <td>${timeStr}</td>
        `;
        logTableBody.insertBefore(row, logTableBody.firstChild);
    }

    // SON AŞAMA: Kaydet ve Bitir
    function saveAndFinish() {
        isScanning = false;
        clearInterval(scanInterval);
        
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        
        txtStatus.innerText = "Tarama tamamlandı. Veriler kaydedildi.";
        txtStatus.style.color = "var(--dark)";
        btnScan.disabled = true;
        btnFinish.disabled = true;
        
        alert(`Tarama işlemi bitti! Toplam ${savedSerialNumbers.size} adet benzersiz banknot başarıyla kaydedildi.`);
    }
</script>

</body>
</html>
