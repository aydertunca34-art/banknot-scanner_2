<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TL Banknot Seri No Tarayıcı V3.6</title>
    <!-- Tesseract.js Kararlı v5 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 10px; background: #f4f6f9; text-align: center; color: #333; }
        .container { max-width: 480px; margin: 0 auto; background: white; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; font-size: 18px; color: #0d6efd; font-weight: 700; letter-spacing: -0.5px; }
        
        /* Durum Çubuğu */
        #status { padding: 12px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; font-size: 13px; background: #fff3cd; color: #856404; border: 1px solid #ffeeba; transition: all 0.2s; }
        .ready { background: #d1e7dd !important; color: #0f5132 !important; border-color: #badbcc !important; }
        .duplicate { background: #f8d7da !important; color: #842029 !important; border-color: #f5c2c7 !important; animation: shake 0.2s ease-in-out 2; }
        
        /* Kamera Alanı */
        .video-container { position: relative; width: 100%; aspect-ratio: 4/3; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* TL Seri No İdeal Dikdörtgen Kılavuz Çizgisi */
        .scanner-laser {
            position: absolute; top: 38%; left: 15%; width: 70%; height: 45px;
            border: 3px solid #0d6efd; border-radius: 8px; box-shadow: 0 0 12px rgba(13, 110, 253, 0.5);
            box-sizing: border-box; pointer-events: none; transition: border-color 0.2s;
        }
        .ready-laser { border-color: #198754 !important; box-shadow: 0 0 12px rgba(25, 135, 84, 0.5) !important; }
        
        /* Butonlar */
        .btn-group { margin: 15px 0; display: flex; gap: 8px; justify-content: center; }
        button { flex: 1; padding: 12px 8px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-start { background: #0d6efd; color: white; }
        .btn-start:disabled { background: #ced4da; color: #6c757d; cursor: not-allowed; }
        .btn-excel { background: #198754; color: white; }
        .btn-excel:disabled { background: #ced4da; color: #6c757d; cursor: not-allowed; }
        .btn-reset { background: #6c757d; color: white; max-width: 80px; }
        
        /* Sayaç */
        .counter-badge { font-size: 13px; font-weight: bold; margin-bottom: 10px; display: inline-block; padding: 4px 10px; background: #e9ecef; border-radius: 20px; }
        
        /* Önizleme ve Sonuç Tablosu */
        .preview-box { margin-top: 10px; border: 1px solid #dee2e6; padding: 6px; background: #f8f9fa; border-radius: 10px; display: flex; flex-direction: column; align-items: center; }
        canvas { width: 100%; max-width: 220px; height: auto; border: 1px solid #ced4da; border-radius: 4px; margin-top: 4px; background: #fff; }
        
        .table-container { margin-top: 15px; max-height: 180px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        th, td { padding: 8px; border-bottom: 1px solid #dee2e6; }
        th { background: #f8f9fa; font-weight: 600; position: sticky; top: 0; color: #495057; }
        tr:first-child td { background: #e8f0fe; font-weight: bold; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    </style>
</head>
<body>

<div class="container">
    <h2>TL Banknot Seri No Tarayıcı V3.6</h2>
    
    <div id="status">Modüller Kuruluyor...</div>
    
    <div class="counter-badge">Okunan Benzersiz Banknot: <span id="countVal">0</span></div>
    
    <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="laser" class="scanner-laser"></div>
    </div>
    
    <div class="btn-group">
        <button id="btnStart" class="btn-start" onclick="startCamera()" disabled>Kamerayı Aç</button>
        <button id="btnExcel" class="btn-excel" onclick="exportToExcel()" disabled>Excel'e Aktar</button>
        <button class="btn-reset" onclick="resetList()">Temizle</button>
    </div>
    
    <div class="preview-box">
        <div style="font-size:11px; color:#6c757d; font-weight:600;">Canlı Yazı Filtresi (OCR Girişi):</div>
        <canvas id="cropCanvas"></canvas>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">Saat</th>
                    <th style="width: 65%;">Seri Numarası</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
    const statusDiv = document.getElementById('status');
    const laserDiv = document.getElementById('laser');
    const btnStart = document.getElementById('btnStart');
    const btnExcel = document.getElementById('btnExcel');
    const countVal = document.getElementById('countVal');
    const resultBody = document.getElementById('resultBody');

    let worker = null;
    let stream = null;
    let scanInterval = null;
    let isProcessing = false;
    
    const registeredSerials = new Set();
    const tableData = []; // Excel aktarımı için sıralı veri matrisi
    let lastRawText = ""; 
    let matchCount = 0; 

    // GitHub Pages / HTTPS Güvenlik Kontrolü
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        statusDiv.innerHTML = "⚠️ Güvenlik Engeli: GitHub Pages ayarlarından HTTPS özelliğinin aktif olduğundan emin olun!";
        statusDiv.style.background = "#f8d7da";
        statusDiv.style.color = "#842029";
    } else {
        initOCR();
    }

    // 1. Tesseract Motoru ve TL Dil/Yazı Ayarları
    async function initOCR() {
        try {
            statusDiv.innerText = "Yapay Zeka Motoru Hazırlanıyor...";
            worker = await Tesseract.createWorker('eng');
            
            // Türk Lirası Seri No Yapısı İçin Katı Filtre (Büyük Harfler ve Rakamlar)
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                tessedit_pageseg_mode: '7' // Tek satırlı metin modu (Hız için kritik)
            });
            
            statusDiv.innerText = "Sistem Hazır. Kamerayı Açın.";
            statusDiv.className = "ready";
            statusDiv.classList.add('ready');
            btnStart.disabled = false;
        } catch (err) {
            statusDiv.innerText = "Yükleme Hatası. İnternet bağlantınızı kontrol edip sayfayı yenileyin.";
            console.error(err);
        }
    }

    // 2. Kamera Donanımını Çalıştırma (Karekod Modu Tetikleyicisi)
    async function startCamera() {
        if (!worker) return;
        
        try {
            const constraints = {
                video: {
                    facingMode: 'environment', // Arka kamera zorlaması
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    focusMode: 'continuous' // Sürekli makro/otomatik odaklanma
                },
                audio: false
            };
            
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            statusDiv.innerText = "Tarama Aktif. Seri numarayı mavi kutuya ortalayın.";
            statusDiv.className = "ready";
            btnStart.disabled = true;
            laserDiv.classList.add('ready-laser');

            // Karekod hızı optimizasyonu: Her 200 milisaniyede bir (Saniyede 5 Kare) analiz döngüsü
            scanInterval = setInterval(processFrame, 200);
        } catch (err) {
            statusDiv.innerText = "Kamera izni reddedildi veya donanım meşgul!";
            console.error(err);
        }
    }

    // 3. Gerçek Çözünürlük Oranlı Kırpma ve Dijital Ayıklama Filtresi
    function processFrame() {
        if (isProcessing || video.readyState !== video.HAVE_CURRENT_DATA) return;
        isProcessing = true;

        const vW = video.videoWidth;
        const vH = video.videoHeight;

        // Ekranda görünen mavi kutunun gerçek video piksellerindeki tam yeri
        const cropX = vW * 0.15;
        const cropY = vH * 0.38;
        const cropWidth = vW * 0.70;
        const cropHeight = (vH / video.clientHeight) * 45; 

        cropCanvas.width = cropWidth;
        cropCanvas.height = cropHeight;

        // Kutunun içerisindeki ham pikselleri canvas'a bas
        cropCtx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

        // Görüntü İşleme: TL Banknot zemin desenlerini silen Sert Kontrast Filtresi
        const imgData = cropCtx.getImageData(0, 0, cropWidth, cropHeight);
        const data = imgData.data;
        const threshold = 120; // TL kağıt ve ışık kırılmaları için optimize edildi

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i];
            let g = data[i+1];
            let b = data[i+2];
            let v = (0.299 * r + 0.587 * g + 0.114 * b); // Yoğunluk hesaplama
            let finalColor = v > threshold ? 255 : 0; 
            data[i] = data[i+1] = data[i+2] = finalColor;
        }
        cropCtx.putImageData(imgData, 0, 0);

        // OCR Analizine Gönderim
        worker.recognize(cropCanvas.toDataURL('image/jpeg'))
            .then(result => {
                // Sadece harf ve rakamları süz
                let text = result.data.text.replace(/[^A-Z0-9]/g, '').trim();
                
                // Türk Lirası Seri Numarası Biçimi Doğrulama (Genelde 10 veya 11 karakter: Örn A12 3456789)
                if (text.length >= 9 && text.length <= 12) {
                    validateAndRecord(text);
                }
            })
            .catch(err => console.error("Döngü Hatası:", err))
            .finally(() => {
                isProcessing = false; // Sonraki kare kilidini aç
            });
    }

    // 4. İki Kare Karşılaştırma, Mükerrer Kontrolü ve Belleğe Yazma
    function validateAndRecord(cleanText) {
        // OCR Sapma Tolerans Düzeltmeleri (Optik İyileştirme)
        cleanText = cleanText.replace(/^O/, '0').replace(/I/g, '1').replace(/L/g, '1');

        if (cleanText === lastRawText) {
            matchCount++;
            // Üst üste 2 kez teyit edilirse doğrulanmış kabul edilir
            if (matchCount >= 2) {
                if (registeredSerials.has(cleanText)) {
                    statusDiv.innerText = `⚠️ TEKRAR UYARISI: ${cleanText} Zaten Okundu!`;
                    statusDiv.className = "duplicate";
                } else {
                    // Kayıt Kümesine ve Excel Veri Havuzuna Ekle
                    registeredSerials.add(cleanText);
                    const now = new Date().toLocaleTimeString();
                    tableData.push({ saat: now, serino: cleanText });
                    
                    // Arayüz Güncellemeleri
                    countVal.innerText = registeredSerials.size;
                    statusDiv.innerText = `✅ OKUNDU: ${cleanText}`;
                    statusDiv.className = "ready";
                    btnExcel.disabled = false;

                    // Tablonun en üst satırına yerleştirme
                    const row = `<tr><td>${now}</td><td><strong>${cleanText}</strong></td></tr>`;
                    resultBody.insertAdjacentHTML('afterbegin', row);
                }
                matchCount = 0; // Sayaç sıfırla
            }
        } else {
            lastRawText = cleanText;
            matchCount = 1;
        }
    }

    // 5. Excel (CSV) Formatında Dışa Aktarma Fonksiyonu
    function exportToExcel() {
        if (tableData.length === 0) return;
        
        // Türkçe karakter ve Excel uyumluluğu için UTF-8 BOM ekleme
        let csvContent = "\uFEFF";
        csvContent += "Okuma Saati;Banknot Seri Numarası\n"; // Kolon başlıkları
        
        tableData.forEach(row => {
            csvContent += `${row.saat};${row.serino}\n`;
        });
        
        // Excel indirme dosyasını oluşturma
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        const tarih = new Date().toLocaleDateString().replace(/\//g, '-');
        link.setAttribute("href", url);
        link.setAttribute("download", `TL_Seri_Numaralari_${tarih}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Listeyi Sıfırlama
    function resetList() {
        if(confirm("Tüm listeyi temizlemek istediğinize emin misiniz?")) {
            registeredSerials.clear();
            tableData.length = 0;
            resultBody.innerHTML = "";
            countVal.innerText = "0";
            btnExcel.disabled = true;
            statusDiv.innerText = "Liste temizlendi. Yeni tarama yapabilirsiniz.";
            statusDiv.className = "ready";
        }
    }

    // Kamera Kapatma Protokolü
    function stopCamera() {
        if (scanInterval) clearInterval(scanInterval);
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        video.srcObject = null;
        laserDiv.classList.remove('ready-laser');
    }
</script>

</body>
</html>
